input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # correlationId, userId, username sont déjà dans le JSON envoyé par logstash-logback-encoder
  date {
    match   => ["@timestamp", "ISO8601"]
    target  => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "championship-logs-%{+YYYY.MM.dd}"
  }
}
